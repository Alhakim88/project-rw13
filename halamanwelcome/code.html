<script>
  (function () {
    // Dark / Light Mode Switcher Logic
    const htmlElem = document.documentElement;
    const themeBtn = document.getElementById('theme-toggle-btn');
    const themeIcon = document.getElementById('theme-icon');
    const themeText = document.getElementById('theme-text');

    function updateThemeUI(isDark) {
      if (isDark) {
        htmlElem.classList.add('dark');
        htmlElem.classList.remove('light');
        if (themeIcon) {
          themeIcon.textContent = 'light_mode';
          themeIcon.classList.remove('text-tertiary-container');
          themeIcon.classList.add('text-amber-300');
        }
        if (themeText) themeText.textContent = 'Light';
      } else {
        htmlElem.classList.remove('dark');
        htmlElem.classList.add('light');
        if (themeIcon) {
          themeIcon.textContent = 'dark_mode';
          themeIcon.classList.remove('text-amber-300');
          themeIcon.classList.add('text-tertiary-container');
        }
        if (themeText) themeText.textContent = 'Dark';
      }
    }

    if (themeBtn) {
      themeBtn.addEventListener('click', () => {
        const isCurrentlyDark = htmlElem.classList.contains('dark');
        updateThemeUI(!isCurrentlyDark);
      });
    }

    const progressBar = document.getElementById('progress-bar');
    const percentageBadge = document.getElementById('percentage-badge');
    const statusLabel = document.getElementById('status-label');
    const subtextStatus = document.getElementById('subtext-status');
    const btnContinue = document.getElementById('btn-continue');

    let currentProgress = 45;
    const interval = setInterval(() => {
      currentProgress += Math.floor(Math.random() * 18) + 12;
      if (currentProgress >= 100) {
        currentProgress = 100;
        clearInterval(interval);

        if (progressBar) progressBar.style.width = '100%';
        if (percentageBadge) {
          percentageBadge.textContent = '100% - Berhasil Diverifikasi';
          percentageBadge.classList.remove('bg-surface-container-highest', 'text-on-surface');
          percentageBadge.classList.add('bg-primary-fixed', 'text-on-primary-fixed');
        }
        if (statusLabel) {
          statusLabel.textContent = 'Sesi Terverifikasi';
        }
        if (subtextStatus) {
          subtextStatus.textContent = 'Selamat datang kembali, siap menjelajahi data RW 13.';
        }
      } else {
        if (progressBar) progressBar.style.width = currentProgress + '%';
        if (percentageBadge) percentageBadge.textContent = currentProgress + '%';
      }
    }, 280);

    if (btnContinue) {
      btnContinue.addEventListener('click', () => {
        btnContinue.classList.add('opacity-80');
      });
    }
  })();
</script></main>
