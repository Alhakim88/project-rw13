<body class="min-h-screen flex items-center justify-center p-4">
<!-- BEGIN: MainContainer -->
<main class="w-full max-w-sm" data-purpose="login-wrapper">
<!-- BEGIN: HeaderSection -->
<header class="flex items-center justify-center mb-6"><img alt="Logo Kota Patriot" class="w-12 h-14 object-contain mr-3 shrink-0" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDmYdBmFX5wbkx_kvBQLdIcq9aScJgxOXDjIaIaG7rHeFWopBu-sNbjJeJaHiv2GWGEKcNjBIw9Q_ZZSQl2PSI22uHzUBYBNH739BMqPIgjeVxYmvLETaxbKGHG_1ZPTslyZ5mPr8QFmHC_IU5QbUIZ8LCFeJqZ1mmZfGnR2TKzqI7Wn8UbkhXC0s27GRld-O20jb4aMDJmlY6uUk42oNrAeN2z55eJDlvJPJQAjzaD2pcZIbCYe5U-"><div class="flex flex-col text-left"><h1 class="text-base font-bold text-white tracking-wide uppercase leading-tight">REGISTRASI WARGA RW 13</h1><p class="text-[10px] text-slate-400 font-medium leading-snug uppercase">KELURAHAN MARGAHAYU KECAMATAN BEKASI TIMUR</p><p class="text-[10px] text-slate-400 leading-snug">Jl. Cendrawasih Raya No. 1 RT. 007 RW. 013</p></div></header>
<!-- END: HeaderSection -->
<!-- BEGIN: LoginForm -->
<div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-2xl" data-purpose="form-card">
<form class="space-y-4" id="loginForm" onsubmit="event.preventDefault(); const fb = document.getElementById('feedbackMessage'); fb.style.display = 'block'; fb.classList.remove('opacity-0'); fb.classList.add('opacity-100'); setTimeout(() =&gt; { window.location.href = '{{DATA:SCREEN:SCREEN_12}}'; }, 1200);" action="{{DATA:SCREEN:SCREEN_12}}"><div>
<label class="block text-sm font-medium text-slate-300 mb-1" for="nameInput">Nama Lengkap</label>
<input class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-md text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm" id="nameInput" name="fullName" placeholder="Contoh: Sari Wulandari" required="" type="text">
</div>
<div>
<label class="block text-sm font-medium text-slate-300 mb-1" for="nikInput">NIK / No. KTP</label>
<input class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-md text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm" id="nikInput" maxlength="16" name="nik" placeholder="16 digit Nomor Induk Kependudukan" required="" type="text">
</div>
<div>
<label class="block text-sm font-medium text-slate-300 mb-1" for="contactInput">Email / No. WhatsApp</label>
<input class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-md text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm" id="contactInput" name="contact" placeholder="nama@email.com atau 0812..." required="" type="text">
</div>
<div>
<label class="block text-sm font-medium text-slate-300 mb-1" for="passwordInput">Password</label>
<div class="flex items-center space-x-2">
<input class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-md text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm tracking-wider" id="passwordInput" name="password" placeholder="Buat password akun" required="" type="password">
<button aria-label="Tampilkan atau sembunyikan password" class="px-3 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-semibold rounded-md transition-colors shrink-0" id="togglePasswordBtn" onclick="togglePasswordVisibility()" type="button">Lihat</button>
</div>
</div>
<div>
<label class="block text-sm font-medium text-slate-300 mb-1" for="confirmPasswordInput">Konfirmasi Password</label>
<input class="w-full px-3 py-2 bg-slate-800 border border-slate-700 rounded-md text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-sm tracking-wider" id="confirmPasswordInput" name="confirmPassword" placeholder="Ulangi password" required="" type="password">
</div>
<div class="pt-2 text-center">
<button class="w-full sm:w-auto px-6 py-2 bg-slate-700 hover:bg-slate-600 text-white font-medium text-sm rounded-md transition-colors shadow-sm" type="submit">Daftar Sekarang</button>
</div></form>
<!-- Feedback / Success Message inspired by sample -->
<div class="mt-5 text-center text-sm font-medium text-emerald-400 transition-opacity duration-300" data-purpose="notification-area" id="feedbackMessage" style="display: none;"><p class="mb-2">Pendaftaran berhasil!</p></div><div class="mt-4 pt-4 border-t border-slate-800 text-center text-xs text-slate-400"><p>Sudah punya akun? <a class="text-blue-400 hover:text-blue-300 font-semibold underline decoration-slate-600 underline-offset-2 transition-colors" href="{{DATA:SCREEN:SCREEN_12}}">Masuk di sini</a></p></div>
</div>
<!-- END: LoginForm -->
<!-- Footer Note -->
<footer class="mt-6 text-center text-xs text-slate-500">© 2026 Pengurus RW 13 Kel. Margahayu. Sistem Administrasi &amp; Data Kependudukan.</footer>
</main>
<!-- END: MainContainer -->
<!-- BEGIN: InteractiveScripts -->
<script data-purpose="password-toggle-script">
    // Fungsi untuk mengubah visibilitas password (Show / Hide)
    function togglePasswordVisibility() {
      const passwordField = document.getElementById('passwordInput');
      const toggleBtn = document.getElementById('togglePasswordBtn');

      if (passwordField.type === 'password') {
        passwordField.type = 'text';
        toggleBtn.textContent = 'Tutup';
        toggleBtn.classList.add('bg-blue-600', 'text-white');
        toggleBtn.classList.remove('bg-slate-700', 'text-slate-200');
      } else {
        passwordField.type = 'password';
        toggleBtn.textContent = 'Lihat';
        toggleBtn.classList.remove('bg-blue-600', 'text-white');
        toggleBtn.classList.add('bg-slate-700', 'text-slate-200');
      }
    }
  </script>
<script data-purpose="form-submission-handler">
    // Fungsi sederhana saat tombol Masuk ditekan
    function handleLogin() {
      const feedback = document.getElementById('feedbackMessage');
      
      // Memberikan efek animasi berkedip sederhana saat tombol masuk ditekan
      feedback.classList.remove('opacity-100');
      feedback.classList.add('opacity-0');

      setTimeout(() => {
        feedback.textContent = 'Berhasil masuk. Selamat datang!';
        feedback.classList.remove('opacity-0');
        feedback.classList.add('opacity-100');
      }, 150);
    }
  </script>
<!-- END: InteractiveScripts -->










</body></html>
